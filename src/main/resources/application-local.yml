spring:
  # =========================================================================
  # LOCAL CONFIGURATION (MySQL Port 3306)
  # =========================================================================
  datasource:
    url: jdbc:mysql://localhost:3306/drivedeals?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

motorcircle:
  auth:
    otp-expiry-minutes: 5
    max-otp-attempts: 3
    jwt-access-expiration-minutes: 10080
    jwt-refresh-expiration-days: 7
    allow-mock-otp: true
    mock-otp-value: "123456"
  sms:
    enabled: false
    textbee-api-key: ${TEXTBEE_API_KEY:txb_0cSGWclNsMwHU6TxfOVPe09FjeCAjca8}
