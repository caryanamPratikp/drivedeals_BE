spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

motorcircle:
  auth:
    otp-expiry-minutes: 5
    max-otp-attempts: 3
    jwt-access-expiration-minutes: 15
    jwt-refresh-expiration-days: 7
    allow-mock-otp: true
    mock-otp-value: "123456"
